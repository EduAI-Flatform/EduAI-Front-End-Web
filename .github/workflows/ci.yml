name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Test and build frontend
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: /api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  pwa-browser:
    name: PWA browser smoke tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BACKEND: "1"
      PLAYWRIGHT_PREVIEW: "1"
      VITE_API_BASE_URL: /api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install PWA browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run PWA responsive and install UX scenarios
        run: >-
          npx playwright test playwright/pwa-install.spec.ts
          --project=chromium
          --project=webkit-pwa
          --no-deps

  payment-browser:
    name: Embedded checkout browser tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BACKEND: "1"
      VITE_API_BASE_URL: /api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Embedded Checkout scenarios
        run: >-
          npx playwright test
          playwright/payos-embedded-course.spec.ts
          playwright/sprint24-membership-learner.spec.ts
          --project=chromium
          --no-deps

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payos-embedded-checkout-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7

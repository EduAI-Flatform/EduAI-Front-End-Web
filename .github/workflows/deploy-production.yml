name: Deploy Frontend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eduai-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.eduai.giaoducso.org.vn
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    environment: production

    outputs:
      deploy_start: ${{ steps.deploy_start.outputs.timestamp }}

    steps:
      - name: Record deploy start time
        id: deploy_start
        run: echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$VPS_SSH_KEY" || {
            echo "ERROR: VPS_SSH_KEY is missing"
            exit 1
          }

          test -n "$VPS_KNOWN_HOSTS" || {
            echo "ERROR: VPS_KNOWN_HOSTS is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/eduai_deploy
          chmod 600 ~/.ssh/eduai_deploy

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/eduai_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/eduai_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
          set -Eeuo pipefail

          exec 9>/tmp/eduai-frontend-deploy.lock

          flock -n 9 || {
            echo "Another frontend deployment is running."
            exit 1
          }

          cd /var/www/eduai/frontend

          echo "Fetching source..."
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env.production ]; then
            echo "ERROR: /var/www/eduai/frontend/.env.production does not exist"
            exit 1
          fi

          echo "Installing dependencies..."
          npm ci

          echo "Building frontend..."
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "ERROR: Frontend build did not create dist/index.html"
            exit 1
          fi

          echo "Checking Nginx..."
          nginx -t

          echo "Reloading Nginx..."
          systemctl reload nginx

          echo "Checking production website..."
          sleep 3

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            https://eduai.giaoducso.org.vn \
            > /dev/null

          echo "Frontend deployment completed."
          EOF

      - name: Cleanup SSH files
        if: ${{ always() }}
        run: |
          rm -f ~/.ssh/eduai_deploy
          rm -f ~/.ssh/known_hosts

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest

    needs:
      - ci
      - deploy

    if: ${{ always() }}

    steps:
      - name: Telegram - frontend deployment notification
        continue-on-error: true

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}

          CI_RESULT: ${{ needs.ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_START: ${{ needs.deploy.outputs.deploy_start }}

        run: |
          set -Eeuo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN is missing"
            exit 0
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_CHAT_ID is missing"
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          END_TIME="$(date +%s)"

          if [[ "${DEPLOY_START:-}" =~ ^[0-9]+$ ]]; then
            TOTAL_SECONDS=$((END_TIME - DEPLOY_START))
          else
            TOTAL_SECONDS=0
          fi

          if [ "$TOTAL_SECONDS" -lt 0 ]; then
            TOTAL_SECONDS=0
          fi

          HOURS=$((TOTAL_SECONDS / 3600))
          MINUTES=$(((TOTAL_SECONDS % 3600) / 60))
          SECONDS=$((TOTAL_SECONDS % 60))

          if [ "$HOURS" -gt 0 ]; then
            DEPLOY_TIME="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ "$MINUTES" -gt 0 ]; then
            DEPLOY_TIME="${MINUTES}m ${SECONDS}s"
          elif [ "$TOTAL_SECONDS" -gt 0 ]; then
            DEPLOY_TIME="${SECONDS}s"
          else
            DEPLOY_TIME="Không thực hiện deploy"
          fi

          if [ -z "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công"
          fi

          COMMIT_MESSAGE="$(
            printf '%s' "$COMMIT_MESSAGE" |
            tr '\n\r' ' ' |
            cut -c1-250
          )"

          if [ "$CI_RESULT" != "success" ]; then
            TITLE="❌ EduAI Frontend CI Thất Bại"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🔴 CI: ${CI_RESULT^^}" \
              "⚪ Deploy: Không thực hiện" \
              "ℹ️ Source code chưa được đưa lên VPS")"

          elif [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="🎨 EduAI Frontend Deploy Thành Công"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🟢 Deploy: SUCCESS" \
              "🟢 Health Check: PASSED" \
              "🔗 Website: https://eduai.giaoducso.org.vn")"

          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            TITLE="⚠️ EduAI Frontend Deploy Đã Bị Hủy"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🟠 Deploy: CANCELLED" \
              "ℹ️ Kiểm tra website và log triển khai")"

          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            TITLE="⚠️ EduAI Frontend Deploy Bị Bỏ Qua"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🟠 Deploy: SKIPPED" \
              "ℹ️ Kiểm tra điều kiện chạy của job deploy")"

          else
            TITLE="❌ EduAI Frontend Deploy Thất Bại"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🔴 Deploy: ${DEPLOY_RESULT^^}" \
              "🟡 Website: Kiểm tra trạng thái production" \
              "🔗 Website: https://eduai.giaoducso.org.vn")"
          fi

          MESSAGE="$(printf '%s\n' \
            "$TITLE" \
            "" \
            "🌐 Môi trường: Production" \
            "📦 Repository: ${REPOSITORY}" \
            "🌿 Branch: ${BRANCH}" \
            "" \
            "🔖 Commit:" \
            "${SHORT_SHA} - ${COMMIT_MESSAGE}" \
            "" \
            "👤 Người thực hiện: ${ACTOR}" \
            "🚀 Workflow: ${WORKFLOW}" \
            "🔢 Run: #${RUN_NUMBER}" \
            "⏱️ Thời gian deploy: ${DEPLOY_TIME}" \
            "" \
            "${RESULT_MESSAGE}" \
            "" \
            "📋 Chi tiết:" \
            "${RUN_URL}")"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null

          echo "Telegram notification sent."
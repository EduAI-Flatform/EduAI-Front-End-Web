name: Deploy Frontend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eduai-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.eduai.giaoducso.org.vn
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder
        run: npm run build

      - name: Run tests
        run: npm test
        continue-on-error: false

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/eduai_deploy
          chmod 600 ~/.ssh/eduai_deploy

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/eduai_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
          set -Eeuo pipefail

          exec 9>/tmp/eduai-frontend-deploy.lock
          flock -n 9 || {
            echo "Another frontend deployment is running."
            exit 1
          }

          cd /var/www/eduai/frontend

          echo "Fetching source..."
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env.production ]; then
            echo "ERROR: /var/www/eduai/frontend/.env.production does not exist"
            exit 1
          fi

          echo "Installing dependencies..."
          npm ci

          echo "Building frontend..."
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "ERROR: Frontend build did not create dist/index.html"
            exit 1
          fi

          echo "Checking Nginx..."
          nginx -t

          echo "Reloading Nginx..."
          systemctl reload nginx

          echo "Checking production website..."
          sleep 3
          curl --fail --silent --show-error \
            --max-time 15 \
            https://eduai.giaoducso.org.vn \
            > /dev/null

          echo "Frontend deployment completed."
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/eduai_deploy